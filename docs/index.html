const KEY='ai_master_ebooks_state';const M=D.levels.flatMap(l=>l.modules.map(m=>({...m,l})));const byId=id=>M.find(m=>m.id===id);const $=id=>document.getElementById(id);const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=x=>/^https?:\/\//i.test(x)?e(x):'#';const fmt=x=>Number(x).toLocaleString('pt-BR',{maximumFractionDigits:1});const defaults=()=>({weeklyHours:20,completedItems:{},rubricLevels:{},notes:{},sessions:[],studyModule:null,selectedSpecialization:'cv',topicDone:{},projectRepo:{},rubricByLevel:{},theme:'dark',reading:{},readingVersion:1});let state=defaults(),storageOK=true;function normalize(x){if(!x||typeof x!=='object'||!x.completedItems||typeof x.completedItems!=='object'||Array.isArray(x.completedItems))throw Error('Formato inválido');let z={...defaults(),...x};if(![10,15,20,30].includes(z.weeklyHours))z.weeklyHours=20;for(const k of ['completedItems','notes','topicDone','projectRepo','rubricByLevel','rubricLevels','reading'])if(!z[k]||typeof z[k]!=='object'||Array.isArray(z[k]))z[k]={};z.sessions=Array.isArray(z.sessions)?z.sessions.filter(a=>a&&byId(a.module)&&Number.isFinite(Number(a.hours))&&Number(a.hours)>0&&Number(a.hours)<=24).map(a=>({...a,hours:Number(a.hours)})):[];if(x.readingVersion!==1){for(const m of M)delete z.completedItems[m.id];z.reading={};z.readingVersion=1;}z.theme=z.theme==='light'?'light':'dark';return z}function save(){if(window.onlineSave)window.onlineSave();}function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window.tid);window.tid=setTimeout(()=>$('toast').hidden=true,2700)}const isDone=id=>!!state.completedItems[id];const finished=()=>M.filter(m=>isDone(m.id));const next=()=>M.find(m=>!isDone(m.id));const logged=()=>state.sessions.reduce((a,b)=>a+b.hours,0);const bar=p=>`<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}" aria-label="Progresso"><span style="width:${p}%"></span></div>`;const pct=l=>l.modules.length?Math.round(l.modules.filter(m=>isDone(m.id)).length/l.modules.length*100):0;const pageNames={home:'Início',trail:'Trilha de estudos',study:'Estudar',level:'Trilha de estudos',library:'Biblioteca',projects:'Prática e avaliação',plan:'Horas e planejamento',settings:'Configurações',search:'Busca',admin:'Administração'};const navItems=[['home','Início','M3 11 12 3l9 8v10h-6v-7H9v7H3z'],['trail','Trilha de estudos','M4 5h16M4 12h16M4 19h16'],['library','Biblioteca','M4 4h7v16H4zM13 4h7v16h-7z'],['projects','Prática e avaliação','M5 4h14v16H5zM8 9h8M8 13h8'],['plan','Horas e planejamento','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 6v6l4 2']];let view='home',arg=null;function menu(open){$('sidebar').classList.toggle('open',open)}function go(v,a){view=v;arg=a;menu(false);if(v==='study'&&byId(a)){state.studyModule=a;save()}render();window.scrollTo(0,0);$('app').focus({preventScroll:true})}function shell(){document.documentElement.dataset.theme=state.theme;let active=['study','level'].includes(view)?'trail':view;$('nav').innerHTML=navItems.map(([v,n,p])=>`<button ${active===v?'aria-current="page"':''} onclick="go('${v}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="${p}"/></svg>${n}</button>`).join('');$('headerLabel').textContent=pageNames[view];const p=Math.round(finished().length/M.length*100);$('sideBar').innerHTML=`<span style="width:${p}%"></span>`;$('sideProgress').textContent=`${finished().length} de ${M.length} módulos · ${p}%`}function intro(t,s){return `<div class="intro"><h1>${t}</h1><p>${s}</p></div>`}function metric(t,v,s=''){return `<div class="panel"><p>${t}</p><div class="metric">${v}</div><small>${s}</small></div>`}function check(id,text,kind='completedItems'){return `<label class="check"><input type="checkbox" ${state[kind][id]?'checked':''} onchange="setCheck('${kind}','${id}',this.checked)"><span>${e(text)}</span></label>`}function setCheck(kind,id,val){state[kind][id]=val;save();if(kind==='completedItems')render();else shell()}function ref(r){return `<div class="resource"><a href="${safe(r.url)}" target="_blank" rel="noopener noreferrer">${e(r.title)}</a><span aria-hidden="true" class="muted">↗</span></div>`}function moduleRow(m){return `<div class="module"><span class="num">${isDone(m.id)?'✓':m.id.split('m')[1]}</span><div class="grow"><strong>${e(m.name)}</strong><p class="small">${m.hours} h · ${isDone(m.id)?'Concluído':state.studyModule===m.id?'Último acesso':'Pendente'}</p></div><button onclick="go('study','${m.id}')">${isDone(m.id)?'Revisar':'Estudar'} →</button></div>`}function levelRows(){return D.levels.map(l=>`<div class="level"><span class="num">${l.id}</span><div><strong>${e(l.title)}</strong><p class="small">${l.hours?l.hours+' h · '+l.modules.length+' módulos':'Formação contínua'}</p></div><div class="levelprog">${l.hours?bar(pct(l))+`<small>${pct(l)}% dos módulos</small>`:'<small>Sem prazo final</small>'}</div><button onclick="go('level',${l.id})">Abrir →</button></div>`).join('')}
function home(){const m=byId(state.studyModule)&&!isDone(state.studyModule)?byId(state.studyModule):next();return intro('Seu próximo passo','Estude inteligência artificial com e-books e vídeos complementares, no seu ritmo.')+`<section class="panel hero"><div><div class="eyebrow">${finished().length?'Continue sua formação':'Comece por aqui'}</div><h2>${m?e(m.name):'Formação estruturada concluída'}</h2><p>${m?`Nível ${m.l.id} · Módulo ${m.id.split('m')[1]} de ${m.l.modules.length} · ${m.hours} horas planejadas`:'Continue na etapa de pesquisa e liderança.'}</p></div><button class="primary" onclick="${m?`go('study','${m.id}')`:"go('level',6)"}">${m?(state.studyModule===m.id?'Continuar leitura':'Começar leitura'):'Abrir nível 6'} →</button></section><div class="grid">${metric('Módulos concluídos',finished().length+' / '+M.length,'Dos níveis 0 a 5')}${metric('Horas estudadas',fmt(logged())+' h','Registradas por você')}${metric('Meta semanal',state.weeklyHours+' h',fmt(2400/state.weeklyHours)+' semanas estimadas')}</div><section class="panel"><div class="sectiontitle"><h2>Mapa da formação</h2><small>2.400 h planejadas</small></div>${levelRows()}</section>`}function trail(){return intro('Trilha de estudos','Escolha um nível para acessar a sequência de leituras.')+`<section class="panel">${levelRows()}</section>`}function spec(l){if(!l.specializations)return '';let s=l.specializations.find(x=>x.id===state.selectedSpecialization)||l.specializations[0];return `<section class="panel stack"><h2>Escolha sua especialização</h2><label>Trilha <select onchange="changeSpecialization(this.value)">${l.specializations.map(x=>`<option value="${x.id}" ${s.id===x.id?'selected':''}>${e(x.name)}</option>`).join('')}</select></label><strong>${e(s.name)}</strong><p>${e(s.content)}</p><p><strong>Exemplo:</strong> ${e(s.projectExample)}</p><details><summary>Regras para evitar repetição de projetos</summary><ul>${l.antiRepetitionRules.map(t=>`<li>${e(t)}</li>`).join('')}</ul></details></section>`}function complete(id){let val=!isDone(id);state.completedItems[id]=val;save();render();toast(val?'Módulo concluído. Você pode avançar!':'Conclusão desfeita.')}function logHours(id,h){h=Number(h);if(!(h>0&&h<=24))return;state.sessions.push({date:new Date().toLocaleDateString('pt-BR'),iso:new Date().toISOString(),module:id,hours:h});save();render();toast('Horas registradas.')}
function projects(id){let l=D.levels[Number.isInteger(Number(id))&&id!==null&&id!==''?Number(id):0]||D.levels[0];let r=state.rubricByLevel[l.id]||{},scores=D.rubricCriteria.map(c=>r[c.id]),rated=scores.every(x=>Number.isInteger(x)&&x>=0&&x<=4),score=rated?D.rubricCriteria.reduce((a,c)=>a+r[c.id]*c.weight/4,0):null,passed=rated&&score>=75&&D.rubricCriteria.every(c=>!c.essential||r[c.id]>=2);return intro('Prática e avaliação','Aplique o conhecimento e comprove seu domínio técnico.')+`<section class="panel stack"><label>Escolher nível <select onchange="go('projects',Number(this.value))">${D.levels.map(x=>`<option value="${x.id}" ${l.id===x.id?'selected':''}>Nível ${x.id} · ${e(x.shortFocus)}</option>`).join('')}</select></label><h2>${e(l.project.title)}</h2><p>${e(l.project.description)}</p><h3>Critérios de domínio</h3>${l.criteria.map(c=>check(c.id,c.text)).join('')}${l.id<6?check('p'+l.id,'Projeto concluído e publicado no portfólio'):''}<details><summary>Checklist do repositório deste projeto</summary>${D.repoChecklist.map(c=>check('l'+l.id+'-'+c.id,c.text,'projectRepo')).join('')}</details></section><section class="panel stack"><div class="row"><h2>Rubrica de avaliação</h2><strong>${rated?fmt(score)+' / 100':'Não avaliado'}</strong></div><p>${rated?(passed?'Pontuação e critérios essenciais atendidos. Confirme também projeto funcional e defesa aprovada.':'Requisitos de pontuação ou critérios essenciais não atendidos.'):'Avalie todos os critérios antes de obter a nota.'}</p>${D.rubricCriteria.map(c=>`<label class="stack" style="gap:4px"><strong>${e(c.name)} · ${c.weight}% ${c.essential?'(essencial)':''}</strong><small>${e(c.evidence)}</small><select onchange="rate(${l.id},'${c.id}',this.value)"><option value="">Não avaliado</option>${['Ausente','Insuficiente','Básico','Competente','Avançado'].map((x,i)=>`<option value="${i}" ${r[c.id]===i?'selected':''}>${i} — ${x}</option>`).join('')}</select></label>`).join('')}<p class="note">Nota mínima 75/100, nenhum critério essencial abaixo de 2, projeto funcional e defesa individual aprovada. Sem revisor externo, grave defesa de 10–15 minutos, responda perguntas sem IA e publique rubrica e evidências. Autoavaliação não equivale a certificação externa.</p></section><details class="panel"><summary>Portfólio de seis projetos</summary>${D.portfolioProjects.map(p=>check(p.id,p.level+' — '+p.title+' — '+p.desc)).join('')}</details>`}function rate(l,id,v){state.rubricByLevel[l]??={};if(v==='')delete state.rubricByLevel[l][id];else state.rubricByLevel[l][id]=Number(v);save();render()}
function plan(){return intro('Horas e planejamento','Ajuste o ritmo e acompanhe o tempo realmente estudado.')+`<section class="panel stack"><h2>Meta de estudo semanal</h2><div class="row wrap" style="justify-content:start">${[10,15,20,30].map(h=>`<button class="${state.weeklyHours===h?'primary':''}" onclick="state.weeklyHours=${h};save();render()">${h} h</button>`).join('')}</div><p>Estimativa total: ${fmt(2400/state.weeklyHours)} semanas · ${fmt(2400/state.weeklyHours/4.345)} meses, sem considerar pausas.</p>${D.weeklyBreakdown.map(w=>`<div class="row"><span>${e(w.name)}</span><strong>${fmt(w.hours20*state.weeklyHours/20)} h</strong></div>`).join('')}</section><section class="panel stack"><h2>Histórico de sessões · ${fmt(logged())} h</h2>${state.sessions.length?state.sessions.map((s,i)=>({...s,i})).reverse().map(s=>`<div class="resource"><div><strong>${e(byId(s.module).name)}</strong><p>${e(s.date)} · ${fmt(s.hours)} h</p></div><button onclick="removeSession(${s.i})" aria-label="Excluir sessão">Excluir</button></div>`).join(''):'<p>Você ainda não registrou horas. Abra um módulo e registre uma sessão.</p>'}</section>`}function removeSession(i){if(confirm('Excluir este registro de horas?')){state.sessions.splice(i,1);save();render()}}
function settings(){return intro('Configurações','Personalize a interface e proteja seus registros.')+`<section class="panel stack"><h2>Aparência</h2><div class="row" style="justify-content:start"><button class="${state.theme==='dark'?'primary':''}" onclick="state.theme='dark';save();render()">Escuro</button><button class="${state.theme==='light'?'primary':''}" onclick="state.theme='light';save();render()">Claro</button></div></section><section class="panel stack"><h2>Backup local</h2><p>Exporte um backup para recuperar seus registros. Quando conectado, seus dados também são sincronizados com sua conta.</p><button onclick="exportData()">Exportar backup JSON</button><label>Importar backup (conclusões antigas de módulos serão reavaliadas)<input type="file" accept=".json,application/json" onchange="importData(this)"></label><small>${storageOK?'Armazenamento local disponível.':'Armazenamento local indisponível; faça backup antes de fechar.'}</small></section><section class="panel stack"><h2>Reiniciar registros</h2><p>Apaga os registros de estudo, anotações, avaliações e checklists desta conta (ou do modo local).</p><button class="danger" onclick="reset()">Apagar meu progresso</button></section>`}function exportData(){const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='ai-master-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(input){try{let z=normalize(JSON.parse(await input.files[0].text()));if(confirm('Substituir os registros atuais pelo backup?')){state=z;save();go('home');toast('Backup importado.')}}catch(err){alert('Arquivo de backup inválido.')}input.value=''}function reset(){if(confirm('Apagar todos os registros de estudo? Exporte um backup antes.')){state=defaults();save();go('home')}}
